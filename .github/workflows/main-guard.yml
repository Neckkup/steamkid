name: main guard

# GitHub Free cannot *prevent* a force push to main on a private repo — the
# ruleset API answers 403 "Upgrade to GitHub Pro or make this repository
# public" (measured 2026-09-23, see docs/adr/0007-branch-protection.md). A
# workflow cannot prevent one either; nothing runs before the ref moves. What
# it can do is make the one unrecoverable-looking event loud, and record the
# SHA main pointed at beforehand, so the history is recoverable by hand.
#
# Delete this file the day a real ruleset blocks non-fast-forward pushes.

on:
  push:
    branches: [main]

# Deliberately no `concurrency` block. CI cancels superseded runs; this must
# not, because the push that supersedes a force push is exactly the one that
# would cancel the only record of it.

permissions: {}

jobs:
  force-push:
    runs-on: ubuntu-latest
    steps:
      - name: Reject a rewritten main
        if: github.event.forced
        run: |
          echo "::error title=main was force pushed::main was rewritten by ${{ github.event.sender.login }}. Before this push it pointed at ${{ github.event.before }}; it now points at ${{ github.sha }}."
          echo "To recover the discarded history:"
          echo "  git fetch origin ${{ github.event.before }}"
          echo "  git log --oneline ${{ github.event.before }}"
          echo "Unreferenced commits are reachable by SHA until GitHub garbage-collects them, so act on this today, not next week."
          exit 1

      - name: Fast-forward
        if: ${{ !github.event.forced }}
        run: echo "main advanced from ${{ github.event.before }} without rewriting history."
