name: probe-token-b

# PRO-123 throwaway probe. Asks what the Actions GITHUB_TOKEN can actually do
# against branch protection with the permissions it can hold. Read-only: it
# never writes protection, it only records the HTTP status of the read.
# Delete this file once PRO-123 records the answer.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: GET /branches/main/protection with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(gh api "repos/${GITHUB_REPOSITORY}/branches/main/protection" \
            --silent --include 2>&1 | head -1 || true)
          echo "PROBE read protection -> ${code}"

      - name: Report the token's own permission set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -i "repos/${GITHUB_REPOSITORY}" 2>&1 \
            | grep -i '^x-accepted-github-permissions\|^x-oauth-scopes\|^HTTP' \
            || echo "PROBE no permission headers returned"
